model:
  label_feature_path: ${features.save_dir}/${features.label_feature_pkl}
  patch_encoder: virchow2  # Options: virchow2 (1280-dim, pathology-specific) or dinov3 (1024-dim, general)
  max_patches_training: 4096  # Limit patches per slide during training to avoid gradient bottleneck (e.g. 160k → 4k)

work_dir: /data/pathology/projects/ivan/WSS/PBIP
run_uid: null  # Auto-generated by pipeline (DO NOT EDIT)

dataset:
  name: custom_wsi
  use_feature_based_training: true
  use_patch_level_dataset: false  # If false, uses WSI-level dataset (CustomWSIPatch*)
  class_order: [benign, BCC]
  
  # ========== REQUIRED DATA DIRECTORIES ==========
  #  features/coordinates (used for everything: prototypes, train, val, test) . can be overlapping and non-overlapping
  patch_features_dir:  /data/pathology/projects/ivan/DeepDerma/MOHS_READER/heatmaps/mohs_cycle/components_overlap_0.5/features_virchow2s2v  # Overlapping features matching attention
  coordinates_dir: /data/pathology/projects/ivan/DeepDerma/MOHS_READER/heatmaps/mohs_cycle/components_overlap_0.5/patches 
  coordinates_suffix: _patches.h5
  
  # Fallback directories (used when files not found in primary location)
  fallback_patch_features_dir: /data/pa_cpgarchive/archives/skin/internal/images/derived/features_virchow_p2_n0_f3/features_virchow2/
  fallback_coordinates_dir: /data/pa_cpgarchive/archives/skin/internal/images/derived/features_virchow_p2_n0_f3/coordinates/
  fallback_coordinates_suffix: .npy
  
  # Attention scores (pseudo-labels) - DUAL PURPOSE:
  #   1. Select high-confidence prototype patches (via threshold_for_prototype)
  #   2. Serve as model inputs during training for refinement
  pseudo_label_dir: /data/pathology/projects/ivan/WSS/ai_attention
  
  # Split and labels
  split_csv: /data/pathology/projects/ivan/DeepDerma/documents/classifier_splits/mohs_based_on_2024_test/splits_0.csv
  labels_csv: /data/pathology/projects/ivan/WSS/labels_dummy.csv
  
  # ========== OPTIONAL VISUALIZATION AND INFERENCE DIRECTORIES ==========
  wsi_dir: /data/pa_cpgarchive/archives/skin/internal/images/derived/packed_p2/packed
  
  # Global slide-level features (optional, auto-generated if missing)
  global_feature_dir: null  # Path to precomputed slide-level features
  auto_generate_patch_features: false  # Auto-generate Virchow2 features if patch_features_dir missing
  auto_generate_global_features: false  # Auto-generate TITAN global features if global_feature_dir missing
  global_feature_encoder: titan  # Options: titan, avgpool, or same as patch_encoder
  
  # Ground truth pixel annotations (for test/validation metrics only)
  gt_dir: /data/pathology/projects/ivan/WSS/gt_annotations
  
  # ========== DATASET PARAMETERS ==========
  num_classes: 2
  patch_size: 224
  binary_mode: true
  input_size: [224, 224]
  max_patches: null
  
  # ========== ATTENTION SCORE CONFIGURATION ==========
  use_pseudo_labels: true
  prototype_selection_strategy: percentile  # Options: percentile, threshold, entropy, margin
  threshold_for_prototype: {0: null, 1: 0.995}  # Per-class percentile thresholds for prototype selection
  prototype_label_required_classes: [1]  # Only use attention scores for tumor (class 1); benign is all-zero
  prototype_min_patches: 0  # Minimum patches per WSI to include in prototype bank
  
  # WSI format configuration
  wsi_suffix: .tif  # WSI file extension (.tif, .svs, .ndpi, etc.)

features:
  proto_image_dir: ${work_dir}/runs/${run_uid}/prototypes
  save_dir: ${work_dir}/runs/${run_uid}/image_features
  features_for_prototype_clusters: features_for_prototype_clusters.pkl
  label_feature_pkl: label_feature_prototype_bank.pkl
  k_list: [6,6]  # Number of subclasses per parent class
  nk: 5  # Number of representative images per subclass
  n_slides_per_class_for_prototypes: 500
  selection_method: top_attention

output_dirs:
  ckpt_dir: ${work_dir}/runs/${run_uid}/checkpoints
  pred_dir: ${work_dir}/runs/${run_uid}/predictions
  train_log_dir: ${work_dir}/runs/${run_uid}/training_logs

train:
  samples_per_gpu: 2
  epoch: 50
  contrastive_loss_weight: 0.5
  infonce_temperature: 0.07

optimizer:
  type: AdamW
  learning_rate: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.003

scheduler:
  warmup_iter: 0
  warmup_ratio: 1.0e-06
  power: 1.0

wandb:
  project: PBIP-WSI-Segmentation
  enabled: true